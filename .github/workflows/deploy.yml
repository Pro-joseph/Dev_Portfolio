name: Deploy to cPanel (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: Build & FTP Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone output)
        run: npm run build

      - name: Assemble deploy bundle
        run: |
          mkdir -p deploy
          # Standalone runtime (server.js + traced node_modules)
          cp -r .next/standalone/. deploy/
          # Static assets Next expects next to the server
          cp -r .next/static deploy/.next/static
          # Prune repo pollution the file tracer copied into standalone/
          # (process.cwd()-relative data/ reads defeat the tracer, so the
          # whole project ends up in .next/standalone — strip all of it).
          rm -rf deploy/src deploy/tests deploy/docs deploy/scripts \
            deploy/AGENTS.md deploy/CLAUDE.md deploy/README.md \
            deploy/next.config.ts deploy/package-lock.json \
            deploy/postcss.config.mjs deploy/tsconfig.json \
            deploy/tsconfig.tsbuildinfo deploy/vitest.config.mjs \
            deploy/eslint.config.mjs deploy/joseph-portfolio-deploy.zip \
            deploy/.env.production
          # Re-add public and data cleanly (standalone copies were polluted)
          rm -rf deploy/public deploy/data
          cp -r public deploy/public
          # Schema + seed for auto-provisioning the SQLite DB on first boot
          mkdir -p deploy/data
          cp data/schema.sqlite.sql data/seed.json deploy/data/

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          local-dir: deploy/
          server-dir: ${{ vars.SERVER_DIR }}
          dangerous-clean-slate: false